syntax="proto3";

option go_package = "github.com/lucas-woo/chess-clone-v2/api/users/v1/usersv1";

package users.v1;

import "puzzles/v1/users.proto";

service UsersService {

  rpc GetUserProfile(GetUserProfileRequest) returns (GetUserProfileResponse);

  rpc GetMyProfile(GetMyProfileRequest) returns (GetMyProfileResponse);

  rpc UpdateUserProfile(UpdateUserProfileRequest) returns (UpdateUserProfileReseponse);

  rpc SaveUserScore(SaveUserScoreRequest) returns (SaveUserScoreResponse);
  
}