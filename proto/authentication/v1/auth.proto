syntax="proto3";

option go_package = "github.com/lucas-woo/chess-clone-v2/api/authentication/v1/authv1";

package authentication.v1;

message SignUpUserRequest {
  string username = 1;
  string hashed_password = 2;
  string email = 3;
}

message SignUpUserResponse {
  SignUpError signup_error = 1;
  string session_id = 2;
}

Enum SignUpError {
  INVAlID_EMAIL = 0;
  EMAIL_ALREADY_TAKEN = 1;
  INVALID_USERNAME = 2
  USERNAME_ALREADY_TAKEN = 3;
  INVALID_PASSWORD = 4;
}